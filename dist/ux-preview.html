<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>一屏式选菜台 · 体验稿</title>
<style>
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f0e7;color:#213028;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding-bottom:116px}button,input{font:inherit}button{cursor:pointer}.serif{font-family:"Songti SC","STSong",serif}
  .top{position:sticky;top:0;z-index:30;background:rgba(244,240,231,.94);backdrop-filter:blur(18px);border-bottom:1px solid #cec6b6}.topInner{width:min(1180px,calc(100% - 32px));margin:auto;padding:15px 0 0}.brandRow,.controlRow,.sectionHead,.selectBar,.selectedInfo{display:flex;align-items:center}.brandRow{justify-content:space-between;margin-bottom:14px}.brand{font-family:"Songti SC","STSong",serif;font-size:23px;letter-spacing:.18em}.prototype{font-size:10px;letter-spacing:.16em;color:#91443b;border:1px solid #b27c73;padding:6px 9px}.controlRow{gap:10px}.search{flex:1;display:flex;align-items:center;gap:10px;background:#fffdf8;border:1px solid #c9c0af;padding:0 15px;height:48px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:15px}.pantryBtn{height:48px;border:1px solid #243b31;background:#243b31;color:#fff;padding:0 18px;white-space:nowrap;letter-spacing:.08em}.categories{display:flex;gap:25px;overflow:auto;padding:14px 1px 13px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{border:0;background:transparent;padding:5px 0;color:#6f7068;white-space:nowrap;position:relative}.cat.on{color:#913f36}.cat.on:after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:2px;background:#913f36}
  main{width:min(1180px,calc(100% - 32px));margin:0 auto}.intro{padding:34px 0 22px}.kicker{font-size:10px;letter-spacing:.22em;color:#978a72}.intro h1{font-family:"Songti SC","STSong",serif;font-weight:400;font-size:38px;letter-spacing:.12em;margin:10px 0 8px}.intro p{color:#78766d;margin:0;font-size:13px}.modeTag{display:none;margin-top:15px;color:#8f4037;font-size:13px}.modeTag.show{display:block}.sectionHead{justify-content:space-between;border-top:1px solid #b5aa96;padding:20px 0 15px}.sectionHead h2{font-family:"Songti SC","STSong",serif;font-size:21px;font-weight:500;letter-spacing:.12em;margin:0}.count{color:#8a8579;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 17px}.card{position:relative;border:0;background:transparent;text-align:left;padding:0 0 14px;color:inherit}.photo{height:178px;background-size:200% 200%;background-position:var(--pos);background-color:#ddd5c6;filter:saturate(.82);position:relative;overflow:hidden}.photo:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.34)}.pickMark{position:absolute;right:10px;top:10px;z-index:2;display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.8);background:rgba(24,37,31,.66);color:#fff;font-size:18px;transition:.2s}.card.selected .pickMark{background:#933e35;border-color:#933e35}.card.selected .photo{outline:2px solid #933e35;outline-offset:3px}.card h3{font-family:"Songti SC","STSong",serif;font-size:18px;font-weight:500;letter-spacing:.08em;margin:14px 0 6px}.meta{font-size:11px;color:#868075;line-height:1.55}.match{display:inline-block;margin-top:7px;padding:4px 7px;background:#e1eadf;color:#31503e;font-size:10px}.more{display:block;margin:30px auto 10px;border:1px solid #8f887a;background:transparent;padding:11px 25px;color:#38443d}.empty{grid-column:1/-1;padding:80px 0;text-align:center;color:#817d73}
  .selectBar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:45;width:min(760px,calc(100% - 28px));min-height:72px;background:#20342b;color:#f5f0e5;border:1px solid #776d58;box-shadow:0 20px 60px rgba(24,38,31,.28);padding:10px 11px 10px 18px;justify-content:space-between;gap:16px;transition:.3s}.selectBar.show{transform:translate(-50%,0)}.selectedInfo{gap:12px;min-width:0}.selectedInfo b{font-size:18px;color:#d9c589}.thumbs{display:flex}.mini{width:38px;height:38px;border:2px solid #20342b;margin-left:-9px;background-size:200% 200%;background-position:var(--pos)}.mini:first-child{margin-left:0}.openMenu{border:1px solid #c7b987;background:transparent;color:#fff;padding:12px 17px;letter-spacing:.1em;white-space:nowrap}
  .shade{position:fixed;inset:0;z-index:60;display:none;background:rgba(20,28,23,.58);backdrop-filter:blur(6px)}.shade.open{display:block}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(470px,92vw);background:#f6f2e9;padding:26px;overflow:auto;box-shadow:-20px 0 70px rgba(0,0,0,.2)}.drawerHead{display:flex;justify-content:space-between;align-items:center}.drawer h2{font-family:"Songti SC","STSong",serif;font-size:28px;font-weight:400;letter-spacing:.1em}.closeBtn{border:0;background:transparent;font-size:28px}.chosenIngredients{min-height:42px;padding:12px 0;border-bottom:1px solid #cec6b7;color:#8a8377;font-size:12px}.ingredientGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.ingredient{border:1px solid #c8c0b1;background:transparent;padding:9px 4px;color:#535951}.ingredient.on{background:#263b32;color:#fff;border-color:#263b32}.apply{width:100%;border:0;background:#913f36;color:#fff;padding:14px;letter-spacing:.12em}.clearIng{width:100%;border:0;background:transparent;color:#7e7669;padding:13px}
  .menuPage{position:fixed;inset:0;z-index:80;display:none;background:#eee9df;overflow:auto}.menuPage.open{display:block}.menuTop{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px max(20px,calc((100% - 980px)/2));background:rgba(238,233,223,.94);backdrop-filter:blur(12px);border-bottom:1px solid #ccc2b1}.back{border:0;background:transparent;color:#28382f}.menuActions{display:flex;gap:8px}.menuAction{border:1px solid #786f60;background:transparent;padding:9px 13px}.menuAction.primary{background:#913f36;color:#fff;border-color:#913f36}.paper{width:min(900px,calc(100% - 28px));margin:35px auto 70px;background:#f8f4ea;border:1px solid #b4aa96;padding:54px;position:relative}.paper:before{content:"";position:absolute;inset:15px;border:1px solid #d4ccbc;pointer-events:none}.menuHeader{text-align:center;border-bottom:1px solid #a49a87;padding-bottom:28px;position:relative}.seal{display:inline-grid;place-items:center;width:35px;height:35px;border:1px solid #9b3e34;color:#9b3e34;font-family:"Songti SC",serif;font-size:11px;margin-bottom:12px}.menuHeader h1{font-family:"Songti SC","STSong",serif;font-weight:400;letter-spacing:.22em;margin:0 0 11px}.menuDate{font-size:11px;color:#81796b}.finalGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:22px}.finalDish{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;border-bottom:1px solid #d8d0c1;padding:14px 0}.finalPhoto{width:72px;height:58px;background-size:200% 200%;background-position:var(--pos)}.finalDish h3{font-family:"Songti SC","STSong",serif;font-weight:500;margin:0 0 5px}.finalDish p{font-size:11px;color:#817b70;margin:0}
  @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){body{padding-bottom:100px}.topInner,main{width:min(100% - 24px,560px)}.brand{font-size:19px}.controlRow{align-items:stretch}.pantryBtn{padding:0 13px}.intro{padding:26px 0 18px}.intro h1{font-size:30px}.grid{grid-template-columns:1fr 1fr;gap:22px 10px}.photo{height:135px}.card h3{font-size:16px}.thumbs{display:none}.selectBar{bottom:9px;min-height:62px}.ingredientGrid{grid-template-columns:repeat(3,1fr)}.paper{padding:42px 25px}.finalGrid{grid-template-columns:1fr}.menuTop{padding:12px}.menuAction{font-size:12px;padding:8px}.menuHeader h1{font-size:27px}}
  @media print{body>*{display:none!important}.menuPage{display:block!important;position:static!important}.menuTop{display:none!important}.paper{display:block!important;margin:0!important;width:100%!important;border:0!important}}
</style>
</head>
<body>
<header class="top"><div class="topInner">
  <div class="brandRow"><div class="brand">今日菜单</div><div class="prototype">体验稿 A · 不影响正式版</div></div>
  <div class="controlRow"><label class="search">⌕ <input id="search" placeholder="搜索菜名或食材"/></label><button class="pantryBtn" id="openPantry">我有什么食材</button></div>
  <nav class="categories" id="categories"></nav>
</div></header>
<main>
  <section class="intro"><div class="kicker">ONE-SCREEN MENU STATION</div><h1>今晚，想吃什么？</h1><p>点整张菜卡即可加入菜单，再点一次取消。</p><div class="modeTag" id="modeTag"></div></section>
  <div class="sectionHead"><h2 id="sectionTitle">全部菜品</h2><span class="count" id="count"></span></div>
  <section class="grid" id="grid"><div class="empty">正在读取菜单…</div></section>
  <button class="more" id="more">再看 12 道</button>
</main>
<div class="selectBar" id="selectBar"><div class="selectedInfo"><div>已选 <b id="selectedCount">0</b> 道</div><div class="thumbs" id="thumbs"></div></div><button class="openMenu" id="openMenu">查看今晚菜单 →</button></div>
<div class="shade" id="shade"><aside class="drawer"><div class="drawerHead"><h2>手边有什么？</h2><button class="closeBtn" id="closePantry">×</button></div><div class="chosenIngredients" id="chosenIngredients">尚未选择食材</div><div class="ingredientGrid" id="ingredientGrid"></div><button class="apply" id="applyPantry">查看匹配菜品</button><button class="clearIng" id="clearPantry">清空食材</button></aside></div>
<section class="menuPage" id="menuPage"><div class="menuTop"><button class="back" id="back">← 返回继续选菜</button><div class="menuActions"><button class="menuAction" id="print">打印 / PDF</button><button class="menuAction primary" id="download">保存菜单图片</button></div></div><article class="paper"><header class="menuHeader"><div class="seal">家宴</div><h1>今 晚 菜 单</h1><div class="menuDate" id="menuDate"></div></header><div class="finalGrid" id="finalGrid"></div></article></section>
<script>
let dishes=[],common=[],category='全部',limit=12,pantry=new Set(),selected=new Set();
const cats=['全部','鸡肉','鸭肉','猪肉','牛肉','羊肉','鱼类','虾类','蛋类','蔬菜','豆制品','面食','米饭主食','汤类'];
async function loadData(){let text=await fetch('index.html').then(r=>r.text()),dishSource=text.match(/const dishes=(\[[\s\S]*?\]);\s*let category/),commonSource=text.match(/const common=(\[[\s\S]*?\]);/);dishes=Function('return '+dishSource[1])();common=Function('return '+commonSource[1])();let pos=['0% 0%','100% 0%','0% 100%','100% 100%'];dishes.forEach((d,i)=>{d.sheet=d.s||Math.floor(i/4)+1;d.pos=d.p||pos[i%4];d.k=d.r.join(' ')});renderCategories();renderIngredients();render()}
function photo(d){return `background-image:url('assets/food-sheet-${d.sheet}.jpg');--pos:${d.pos}`}
function renderCategories(){categories.innerHTML=cats.map(c=>`<button class="cat ${c===category?'on':''}" data-cat="${c}">${c}</button>`).join('')}
function data(){let q=search.value.trim(),list=dishes.filter(d=>(category==='全部'||d.cs.includes(category))&&(!q||(d.n+d.k+d.cs.join(' ')).includes(q)));if(pantry.size){list=list.map(d=>({...d,have:d.r.filter(x=>pantry.has(x))})).filter(d=>d.have.length).sort((a,b)=>b.have.length-a.have.length)}return list}
function render(){let all=data(),visible=all.slice(0,limit);count.textContent=`${all.length} 道 · 当前显示 ${visible.length} 道`;grid.innerHTML=visible.length?visible.map(d=>`<button class="card ${selected.has(d.n)?'selected':''}" data-pick="${d.n}"><div class="photo" style="${photo(d)}"><span class="pickMark">${selected.has(d.n)?'✓':'＋'}</span></div><h3>${d.n}</h3><div class="meta">${d.cs.join(' · ')} · ${d.t}</div>${pantry.size?`<span class="match">已有 ${d.have.length} 样食材</span>`:''}</button>`).join(''):'<div class="empty">没有找到合适的菜</div>';more.style.display=visible.length<all.length?'block':'none';sectionTitle.textContent=pantry.size?'食材匹配结果':category==='全部'?'全部菜品':category;renderSelected()}
function renderSelected(){selectedCount.textContent=selected.size;selectBar.classList.toggle('show',selected.size>0);let list=[...selected].map(n=>dishes.find(d=>d.n===n)).filter(Boolean);thumbs.innerHTML=list.slice(-5).map(d=>`<span class="mini" style="${photo(d)}"></span>`).join('')}
function renderIngredients(){ingredientGrid.innerHTML=common.map(x=>`<button class="ingredient ${pantry.has(x)?'on':''}" data-ing="${x}">${x}</button>`).join('');chosenIngredients.textContent=pantry.size?'已选：'+[...pantry].join('、'):'尚未选择食材'}
categories.onclick=e=>{let c=e.target.dataset.cat;if(!c)return;category=c;limit=12;renderCategories();render()};search.oninput=()=>{limit=12;render()};grid.onclick=e=>{let n=e.target.closest('[data-pick]')?.dataset.pick;if(!n)return;selected.has(n)?selected.delete(n):selected.add(n);render()};more.onclick=()=>{limit+=12;render()};
openPantry.onclick=()=>shade.classList.add('open');closePantry.onclick=()=>shade.classList.remove('open');shade.onclick=e=>{if(e.target===shade)shade.classList.remove('open')};ingredientGrid.onclick=e=>{let x=e.target.dataset.ing;if(!x)return;pantry.has(x)?pantry.delete(x):pantry.add(x);renderIngredients()};applyPantry.onclick=()=>{limit=12;shade.classList.remove('open');modeTag.classList.toggle('show',pantry.size>0);modeTag.textContent=pantry.size?'正在按 '+[...pantry].join('、')+' 匹配菜品':' ';render()};clearPantry.onclick=()=>{pantry.clear();renderIngredients();modeTag.classList.remove('show');render()};
function showMenu(){let list=[...selected].map(n=>dishes.find(d=>d.n===n)).filter(Boolean);menuDate.textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())+` · 共 ${list.length} 道`;finalGrid.innerHTML=list.map(d=>`<article class="finalDish"><div class="finalPhoto" style="${photo(d)}"></div><div><h3>${d.n}</h3><p>${d.cs.join(' · ')} · ${d.t}</p></div></article>`).join('');menuPage.classList.add('open');history.pushState({menu:true},'','#menu')};openMenu.onclick=showMenu;back.onclick=()=>history.back();onpopstate=()=>menuPage.classList.remove('open');print.onclick=()=>window.print();
function loadPhoto(d){return new Promise(resolve=>{let img=new Image();img.onload=()=>resolve({img,d});img.onerror=()=>resolve({img:null,d});img.src=`assets/food-sheet-${d.sheet}.jpg`})}
download.onclick=async()=>{let list=[...selected].map(n=>dishes.find(d=>d.n===n)).filter(Boolean),pics=await Promise.all(list.map(loadPhoto)),w=1200,rowH=170,h=420+Math.ceil(list.length/2)*rowH,cv=document.createElement('canvas'),c=cv.getContext('2d');cv.width=w;cv.height=h;c.fillStyle='#f7f3e9';c.fillRect(0,0,w,h);c.strokeStyle='#b8ae9b';c.strokeRect(34,34,w-68,h-68);c.textAlign='center';c.fillStyle='#202721';c.font='54px "Songti SC",serif';c.fillText('今 晚 菜 单',w/2,150);c.fillStyle='#7b7467';c.font='16px sans-serif';c.fillText(menuDate.textContent,w/2,190);c.beginPath();c.moveTo(90,225);c.lineTo(w-90,225);c.stroke();c.textAlign='left';pics.forEach(({img,d},i)=>{let x=90+(i%2)*535,y=260+Math.floor(i/2)*rowH;if(img){let sx=d.pos.startsWith('100%')?img.width/2:0,sy=d.pos.endsWith('100%')?img.height/2:0;c.drawImage(img,sx,sy,img.width/2,img.height/2,x,y,120,102)}c.fillStyle='#202721';c.font='26px "Songti SC",serif';c.fillText(d.n,x+145,y+38);c.fillStyle='#817a6e';c.font='15px sans-serif';c.fillText(d.cs.join(' · ')+' · '+d.t,x+145,y+72)});let a=document.createElement('a');a.download='今晚菜单.png';a.href=cv.toDataURL('image/png');a.click();download.textContent='已保存 ✓';setTimeout(()=>download.textContent='保存菜单图片',1600)};
loadData();
</script>
</body>
</html>
