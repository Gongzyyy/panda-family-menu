function render(){let data=filtered();count.textContent=data.length+' 道菜';grid.innerHTML=data.length?data.map(d=>`<article class="card"><div class="food" style="${photoStyle(d)}"><button class="heart ${fav.has(d.n)?'on':''}" data-fav="${d.n}" aria-label="收藏">${fav.has(d.n)?'♥':'♡'}</button></div><h4>${d.n}</h4><p class="meta">${d.cs.join(' · ')} · ${d.t}</p></article>`).join(''):'<div class="empty">这里还没有菜 🍽️</div>'}
function savePantry(){localStorage.setItem('menuPantry',JSON.stringify([...pantryItems]))}
function renderPantry(){ingredientCloud.innerHTML=common.map(x=>`<button class="ingredient ${pantryItems.has(x)?'on':''}" data-ingredient="${x}">${x}</button>`).join('');myIngredients.innerHTML=pantryItems.size?[...pantryItems].map(x=>`<button class="owned" data-remove="${x}">${x}<span>×</span></button>`).join(''):'<span class="count">还没有加入食材</span>';let ranked=dishes.map(d=>{let have=d.r.filter(x=>pantryItems.has(x)),missing=d.r.filter(x=>!pantryItems.has(x));return{...d,have,missing,score:have.length/d.r.length}}).filter(d=>d.have.length).sort((a,b)=>b.score-a.score||a.missing.length-b.missing.length);matchCount.textContent=ranked.length+' 道匹配';matches.innerHTML=ranked.length?ranked.map(d=>`<article class="matchCard"><div class="matchEmoji" style="${photoStyle(d)}"></div><div><h4>${d.n}</h4><div class="meter"><i style="width:${d.score*100}%"></i></div><div class="matchLine ${d.missing.length?'':'ready'}">${d.missing.length?'已有 '+d.have.join('、')+' · 还缺 '+d.missing.join('、'):'✓ 食材齐全，可以开做'}</div></div></article>`).join(''):'<div class="empty">先加入一些食材，我来帮你配菜 🧺</div>'}
chips.onclick=e=>{if(e.target.dataset.cat){category=e.target.dataset.cat;renderChips();render()}};search.oninput=render;
grid.onclick=e=>{let n=e.target.dataset.fav;if(n){fav.has(n)?fav.delete(n):fav.add(n);localStorage.setItem('menuFav',JSON.stringify([...fav]));render()}};
dice.onclick=()=>{let d=dishes[Math.floor(Math.random()*dishes.length)];pick.textContent='就做：'+d.n+' '+d.e};
favFilter.onclick=()=>{view=view==='fav'?'all':'fav';favFilter.classList.toggle('active',view==='fav');favFilter.textContent=view==='fav'?'♥ 正在看收藏':'♡ 只看收藏';listTitle.textContent=view==='fav'?'我的收藏':'全部菜谱';render()};
function addItems(text){text.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>pantryItems.add(x));ingredientInput.value='';savePantry();renderPantry()}addIngredient.onclick=()=>addItems(ingredientInput.value);ingredientInput.onkeydown=e=>{if(e.key==='Enter')addItems(ingredientInput.value)};ingredientCloud.onclick=e=>{let x=e.target.dataset.ingredient;if(x){pantryItems.has(x)?pantryItems.delete(x):pantryItems.add(x);savePantry();renderPantry()}};myIngredients.onclick=e=>{let x=e.target.closest('[data-remove]')?.dataset.remove;if(x){pantryItems.delete(x);savePantry();renderPantry()}};
function openSheet(){sheet.classList.add('open')}styleBtn.onclick=openSheet;close.onclick=()=>sheet.classList.remove('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.theme;localStorage.setItem('menuTheme',b.dataset.theme);document.querySelectorAll('.style').forEach(x=>x.classList.toggle('active',x===b))});
let saved=localStorage.getItem('menuTheme');if(saved){document.body.dataset.theme=saved;document.querySelectorAll('.style').forEach(x=>x.classList.toggle('active',x.dataset.theme===saved))}renderChips();render();renderPantry();
</script>
</body></html>
