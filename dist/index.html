<body data-theme="warm">
<main class="site"><div class="glow"></div>
  <header class="top">
    <div class="brand"><div><div class="eyebrow">PANDA TABLE · 九十八味</div><h1 class="title">熊猫家宴</h1></div><div class="eyebrow">时令 · 风味 · 家宴</div></div>
    <div class="topActions"><button class="topBtn" id="favFilter">♡ 只看收藏</button><button class="avatar" id="styleBtn" aria-label="选择网页风格">✦</button></div>
  </header>
  <section class="dashboard">
    <section class="hero"><small>CHEF'S SELECTION · 今夜荐味</small><h2>一席好味，<br>从从容择菜开始。</h2><div class="heroActions"><button class="dice" id="dice">为今晚择一道</button><div class="pick" id="pick"></div></div></section>
    <section class="pantryHero"><div class="eyebrow">PANTRY PAIRING · 食材配味</div><h2>依食材，择佳肴</h2><p>录入手边已有的食材，为你挑选此刻最合适的一道菜。</p><div class="ingredientInput"><input id="ingredientInput" placeholder="输入食材，如：鸡蛋、番茄、豆腐"/><button class="addBtn" id="addIngredient">添入</button></div><div class="quickTitle">常备之味 · 轻点选择</div><div class="ingredientCloud" id="ingredientCloud"></div><div class="myIngredients" id="myIngredients"></div></section>
  </section>
  <section class="workspace">
    <section class="menuPanel"><div class="toolbar"><label class="search">⌕ <input id="search" placeholder="搜索菜名或食材" /></label></div><div class="chips" id="chips"></div><div class="sectionHead"><h3 id="listTitle">全部菜谱</h3><span class="count" id="count"></span></div><section class="grid" id="grid"></section></section>
    <aside class="matchPanel"><div class="sectionHead"><div><div class="eyebrow">MATCH RESULTS</div><h3>可以做什么</h3></div><span class="count" id="matchCount"></span></div><section class="matchList" id="matches"></section></aside>

 {n:'牛肉馅饼',e:'🥟',cs:['牛肉','面食'],t:'60 分钟',r:['牛肉','面粉','洋葱','葱','姜'],s:28,p:'0% 100%'},

];
let category='全部',view='all';let fav=new Set(JSON.parse(localStorage.getItem('menuFav')||'[]'));let pantryItems=new Set(JSON.parse(localStorage.getItem('menuPantry')||'[]'));let selected=new Set(JSON.parse(localStorage.getItem('menuSelection')||'[]').filter(n=>dishes.some(d=>d.n===n)));const photoPositions=['0% 0%','100% 0%','0% 100%','100% 100%'];dishes.forEach((d,i)=>{d.k=d.r.join(' ');d.sheet=d.s||Math.floor(i/4)+1;d.pos=d.p||photoPositions[i%4]});
const cats=['全部','鸡肉','鸭肉','猪肉','牛肉','羊肉','鱼类','虾类','蛋类','蔬菜','豆制品','面食','米饭主食','汤类','甜品'];
const common=['鸡蛋','皮蛋','番茄','茄子','土豆','胡萝卜','豆腐','干豆腐','千张','葱','小葱','韭菜','姜','蒜','洋葱','肉末','五花肉','猪肉','脊骨','鸡肉','鸡腿','鸡胗','鸭肉','牛肉','牛腩','牛腱子','牛骨汤','排骨','羊排','鱼','虾','三文鱼','米饭','面条','泡面','意面','粉丝','粉条','面粉','淀粉','年糕','红豆','绿豆','银耳','莲子','南瓜','地瓜叶','雪白菇','沙茶酱','芝麻酱','豆角','酸豆角','白菜','包菜','白萝卜','青椒','蒜苔','蘑菇','西兰花','娃娃菜','水芹','泡菜','辣椒','咖喱','红腐乳'];
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('')}
function filtered(){let q=search.value.trim();return dishes.filter(d=>(category==='全部'||d.cs.includes(category))&&(!q||(d.n+d.k+d.cs.join(' ')).includes(q))&&(view!=='fav'||fav.has(d.n)))}
function photoStyle(d){return `background-image:url('assets/food-sheet-${d.sheet}.jpg');--photo-pos:${d.pos}`}
function render(){let data=filtered();count.textContent=data.length+' 道菜';grid.innerHTML=data.length?data.map(d=>`<article class="card ${selected.has(d.n)?'selected':''}"><div class="food" style="${photoStyle(d)}"><button class="heart ${fav.has(d.n)?'on':''}" data-fav="${d.n}" aria-label="收藏">${fav.has(d.n)?'♥':'♡'}</button></div><h4>${d.n}</h4><p class="meta">${d.cs.join(' · ')} · ${d.t}</p><button class="pickDish ${selected.has(d.n)?'on':''}" data-pick="${d.n}">${selected.has(d.n)?'已加入菜单 ✓':'加入菜单 +'}</button></article>`).join(''):'<div class="empty">这里还没有菜 🍽️</div>'}
function savePantry(){localStorage.setItem('menuPantry',JSON.stringify([...pantryItems]))}
function renderPantry(){ingredientCloud.innerHTML=common.map(x=>`<button class="ingredient ${pantryItems.has(x)?'on':''}" data-ingredient="${x}">${x}</button>`).join('');myIngredients.innerHTML=pantryItems.size?[...pantryItems].map(x=>`<button class="owned" data-remove="${x}">${x}<span>×</span></button>`).join(''):'<span class="count">还没有加入食材</span>';let ranked=dishes.map(d=>{let have=d.r.filter(x=>pantryItems.has(x)),missing=d.r.filter(x=>!pantryItems.has(x));return{...d,have,missing,score:have.length/d.r.length}}).filter(d=>d.have.length).sort((a,b)=>b.score-a.score||a.missing.length-b.missing.length);matchCount.textContent=ranked.length+' 道匹配';matches.innerHTML=ranked.length?ranked.map(d=>`<article class="matchCard"><div class="matchEmoji" style="${photoStyle(d)}"></div><div><h4>${d.n}</h4><div class="meter"><i style="width:${d.score*100}%"></i></div><div class="matchLine ${d.missing.length?'':'ready'}">${d.missing.length?'已有 '+d.have.join('、')+' · 还缺 '+d.missing.join('、'):'✓ 食材齐全，可以开做'}</div><button class="matchPick ${selected.has(d.n)?'on':''}" data-pick="${d.n}">${selected.has(d.n)?'已选 ✓':'加入菜单'}</button></div></article>`).join(''):'<div class="empty">先加入一些食材，我来帮你配菜 🧺</div>'}
chips.onclick=e=>{if(e.target.dataset.cat){category=e.target.dataset.cat;renderChips();render()}};search.oninput=render;
function saveSelection(){localStorage.setItem('menuSelection',JSON.stringify([...selected]));renderSelectionDock()}
function toggleSelection(n){selected.has(n)?selected.delete(n):selected.add(n);saveSelection();render();renderPantry()}
function renderSelectionDock(){selectedCount.textContent=selected.size;menuDock.classList.toggle('show',selected.size>0)}
function openFinalMenu(){let chosen=[...selected].map(n=>dishes.find(d=>d.n===n)).filter(Boolean);if(!chosen.length)return;finalMenuDate.textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())+' · 共 '+chosen.length+' 道';finalMenuGrid.innerHTML=chosen.map(d=>`<article class="finalDish"><div class="finalDishPhoto" style="${photoStyle(d)}"></div><div><h3>${d.n}</h3><p>${d.cs.join(' · ')} · ${d.t}</p></div></article>`).join('');finalMenuScreen.classList.add('open');document.body.style.overflow='hidden'}
function closeFinalMenu(){finalMenuScreen.classList.remove('open');document.body.style.overflow=''}
function loadMenuPhoto(d){return new Promise(resolve=>{let img=new Image();img.onload=()=>resolve({img,d});img.onerror=()=>resolve({img:null,d});img.src=`assets/food-sheet-${d.sheet}.jpg`})}
async function downloadMenuImage(){let chosen=[...selected].map(n=>dishes.find(d=>d.n===n)).filter(Boolean);if(!chosen.length)return;saveMenuImage.disabled=true;saveMenuImage.textContent='正在生成…';let photos=await Promise.all(chosen.map(loadMenuPhoto)),rows=Math.ceil(chosen.length/2),w=1200,rowH=170,h=430+rows*rowH,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let c=canvas.getContext('2d');c.fillStyle='#f5f1e7';c.fillRect(0,0,w,h);c.strokeStyle='#b8ae9b';c.lineWidth=2;c.strokeRect(34,34,w-68,h-68);c.strokeStyle='rgba(138,56,47,.28)';c.strokeRect(44,44,w-88,h-88);c.textAlign='center';c.fillStyle='#9b3d33';c.strokeStyle='#9b3d33';c.strokeRect(w/2-22,70,44,44);c.font='16px "Songti SC","STSong",serif';c.fillText('家 宴',w/2,99);c.fillStyle='#8c8068';c.font='14px -apple-system,"PingFang SC",sans-serif';c.fillText("PRIVATE TABLE · TONIGHT'S SELECTION",w/2,145);c.fillStyle='#202721';c.font='54px "Songti SC","STSong",serif';c.fillText('今 晚 菜 单',w/2,218);c.fillStyle='#7b7467';c.font='16px -apple-system,"PingFang SC",sans-serif';c.fillText(finalMenuDate.textContent,w/2,260);c.strokeStyle='#9f9582';c.beginPath();c.moveTo(90,295);c.lineTo(w-90,295);c.stroke();c.textAlign='left';photos.forEach(({img,d},i)=>{let col=i%2,row=Math.floor(i/2),x=90+col*535,y=330+row*rowH;if(img){let sx=d.pos.startsWith('100%')?img.naturalWidth/2:0,sy=d.pos.endsWith('100%')?img.naturalHeight/2:0;c.drawImage(img,sx,sy,img.naturalWidth/2,img.naturalHeight/2,x,y,120,102)}else{c.fillStyle='#ddd6c8';c.fillRect(x,y,120,102)}c.fillStyle='#202721';c.font='26px "Songti SC","STSong",serif';c.fillText(d.n,x+145,y+38);c.fillStyle='#817a6e';c.font='15px -apple-system,"PingFang SC",sans-serif';c.fillText(d.cs.join(' · ')+' · '+d.t,x+145,y+72);c.strokeStyle='#d8d1c4';c.beginPath();c.moveTo(x,y+125);c.lineTo(x+470,y+125);c.stroke()});let a=document.createElement('a'),date=new Date().toISOString().slice(0,10);a.download=`今晚菜单-${date}.png`;a.href=canvas.toDataURL('image/png');a.click();saveMenuImage.disabled=false;saveMenuImage.textContent='已保存 ✓';setTimeout(()=>saveMenuImage.textContent='保存菜单图片',1800)}
grid.onclick=e=>{let n=e.target.dataset.fav;if(n){fav.has(n)?fav.delete(n):fav.add(n);localStorage.setItem('menuFav',JSON.stringify([...fav]));render();return}let p=e.target.closest('[data-pick]')?.dataset.pick;if(p)toggleSelection(p)};
matches.onclick=e=>{let p=e.target.closest('[data-pick]')?.dataset.pick;if(p)toggleSelection(p)};
makeMenu.onclick=openFinalMenu;continueSelect.onclick=closeFinalMenu;saveMenuImage.onclick=downloadMenuImage;printMenu.onclick=()=>window.print();finalMenuScreen.onclick=e=>{if(e.target===finalMenuScreen)closeFinalMenu()};clearMenu.onclick=()=>{selected.clear();saveSelection();render();renderPantry();closeFinalMenu()};
dice.onclick=()=>{let d=dishes[Math.floor(Math.random()*dishes.length)];pick.textContent='就做：'+d.n+' '+d.e};
favFilter.onclick=()=>{view=view==='fav'?'all':'fav';favFilter.classList.toggle('active',view==='fav');favFilter.textContent=view==='fav'?'♥ 正在看收藏':'♡ 只看收藏';listTitle.textContent=view==='fav'?'我的收藏':'全部菜谱';render()};
function addItems(text){text.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>pantryItems.add(x));ingredientInput.value='';savePantry();renderPantry()}addIngredient.onclick=()=>addItems(ingredientInput.value);ingredientInput.onkeydown=e=>{if(e.key==='Enter')addItems(ingredientInput.value)};ingredientCloud.onclick=e=>{let x=e.target.dataset.ingredient;if(x){pantryItems.has(x)?pantryItems.delete(x):pantryItems.add(x);savePantry();renderPantry()}};myIngredients.onclick=e=>{let x=e.target.closest('[data-remove]')?.dataset.remove;if(x){pantryItems.delete(x);savePantry();renderPantry()}};
function openSheet(){sheet.classList.add('open')}styleBtn.onclick=openSheet;close.onclick=()=>sheet.classList.remove('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.theme;localStorage.setItem('menuTheme',b.dataset.theme);document.querySelectorAll('.style').forEach(x=>x.classList.toggle('active',x===b))});
let saved=localStorage.getItem('menuTheme');if(saved){document.body.dataset.theme=saved;document.querySelectorAll('.style').forEach(x=>x.classList.toggle('active',x.dataset.theme===saved))}renderChips();render();renderPantry();renderSelectionDock();
